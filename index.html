<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Knowledge Bot</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1e1e2e;
      --accent: #7c6af7;
      --accent2: #f97316;
      --text: #e8e8f0;
      --muted: #5a5a7a;
      --user-bubble: #1a1a2e;
      --bot-bubble: #13131a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124, 106, 247, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 106, 247, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    .header {
      position: relative;
      z-index: 10;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .header-info h1 {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .header-info p {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      margin-top: 2px;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: #4ade80;
      font-family: 'DM Mono', monospace;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    /* Chat area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      z-index: 1;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* Welcome message */
    .welcome {
      text-align: center;
      padding: 48px 20px;
      animation: fadeUp 0.6s ease;
    }

    .welcome h2 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 0.9rem;
      max-width: 360px;
      margin: 0 auto 28px;
      line-height: 1.6;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 500px;
      margin: 0 auto;
    }

    .suggestion {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Mono', monospace;
    }

    .suggestion:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    /* Messages */
    .message {
      display: flex;
      gap: 12px;
      animation: fadeUp 0.35s ease;
      max-width: 80%;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.bot {
      align-self: flex-start;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .message.user .avatar {
      background: var(--accent2);
    }

    .message.bot .avatar {
      background: linear-gradient(135deg, var(--accent), #a78bfa);
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.88rem;
      line-height: 1.65;
      max-width: 100%;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      border: 1px solid var(--border);
      border-top-right-radius: 4px;
      color: var(--text);
    }

    .message.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      color: var(--text);
    }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 18px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      40% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Input area */
    .input-area {
      position: relative;
      z-index: 10;
      padding: 16px 28px 20px;
      border-top: 1px solid var(--border);
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(12px);
    }

    .input-wrap {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 10px 10px 16px;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 0.88rem;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      padding-top: 2px;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.15s;
    }

    .send-btn:hover {
      opacity: 0.85;
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    .send-btn svg {
      width: 16px;
      height: 16px;
      fill: white;
    }

    .hint {
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">🤖</div>
    <div class="header-info">
      <h1>Claude Knowledge Bot</h1>
      <p>RAG · FAISS · Groq LLaMA</p>
    </div>
    <div class="status">
      <div class="status-dot"></div>
      online
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <h2>Ask me anything</h2>
      <p>I'm trained on Claude & Anthropic knowledge. Ask me about AI, RAG, APIs, and more.</p>
      <div class="suggestions">
        <div class="suggestion" onclick="ask('What is Claude?')">What is Claude?</div>
        <div class="suggestion" onclick="ask('Who made Claude?')">Who made Claude?</div>
        <div class="suggestion" onclick="ask('What is RAG?')">What is RAG?</div>
        <div class="suggestion" onclick="ask('What is FAISS?')">What is FAISS?</div>
        <div class="suggestion" onclick="ask('What is FastAPI?')">What is FastAPI?</div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="userInput" placeholder="Ask something about Claude or AI..." rows="1" onkeydown="handleKey(event)"
        oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24">
          <path d="M2 21L23 12 2 3v7l15 2-15 2v7z" />
        </svg>
      </button>
    </div>
    <p class="hint">Press Enter to send · Shift+Enter for new line</p>
  </div>

  <script>
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function ask(question) {
      document.getElementById('userInput').value = question;
      sendMessage();
    }

    function addMessage(text, role) {
      const welcome = document.getElementById('welcome');
      if (welcome) welcome.remove();

      const chatArea = document.getElementById('chatArea');
      const msg = document.createElement('div');
      msg.className = `message ${role}`;

      const avatar = role === 'user' ? '👤' : '🤖';
      msg.innerHTML = `
        <div class="avatar">${avatar}</div>
        <div class="bubble">${text}</div>
      `;
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
      return msg;
    }

    function addTyping() {
      const welcome = document.getElementById('welcome');
      if (welcome) welcome.remove();

      const chatArea = document.getElementById('chatArea');
      const msg = document.createElement('div');
      msg.className = 'message bot typing';
      msg.id = 'typing';
      msg.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="bubble">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      `;
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const btn = document.getElementById('sendBtn');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = 'auto';
      btn.disabled = true;

      addMessage(text, 'user');
      addTyping();

      try {
        const res = await fetch('https://karthickhf-rag-chatbot.hf.space/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: text })
        });
        const data = await res.json();
        document.getElementById('typing')?.remove();
        addMessage(data.answer, 'bot');
      } catch (err) {
        document.getElementById('typing')?.remove();
        addMessage('⚠️ Error: Make sure the API is running on http://127.0.0.1:8000', 'bot');
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }
  </script>
</body>

</html>
